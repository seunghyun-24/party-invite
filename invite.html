    dev:function(R){
      (function () {
        var target = new Date("2026-12-19T18:00:00+09:00").getTime();
        var cd = R.getElementById("cd");
        function pad(n) {
          return String(n).padStart(2, "0");
        }
        function tick() {
          var ms = target - Date.now();
          if (ms <= 0) {
            cd.textContent = "지금 배포 중 🚀";
            return;
          }
          var d = Math.floor(ms / 864e5),
            h = Math.floor((ms % 864e5) / 36e5),
            m = Math.floor((ms % 36e5) / 6e4),
            s = Math.floor((ms % 6e4) / 1e3);
          cd.textContent =
            "D-" + d + " " + pad(h) + ":" + pad(m) + ":" + pad(s);
        }
        tick();
        setInterval(tick, 1000);

        var FORM =
          "https://docs.google.com/forms/d/e/1FAIpQLSdFVnbFdddZzdiQLrJb8IE2f2RBvia3s3Z308tqJ7Liehr8Cw/formResponse";
        var ENTRY = {

        var out = R.getElementById("out"),
          nm = R.getElementById("nm"),

        var btns = R.querySelectorAll("button[data-k]");
        var timer;

        function play(lines, done) {
          var i = 0;
          clearTimeout(timer);
          out.textContent = "";
          (function next() {
            if (i >= lines.length) {
              if (done) done();
              return;
            }
            out.textContent += (i ? "\n" : "") + lines[i++];
            timer = setTimeout(next, 350);
          })();
        }

              out.textContent =
                "ERROR: author 가 비어 있습니다. 이름부터 적어주세요_";

              return;

            setBusy(true);

              method: "POST",
              mode: "no-cors",
              body: body,

              ? [

              sent
                .then(function () {
                  out.textContent +=
                    "\n" +
                    (yes
                      ? "✔ Merged. 응답이 접수됐습니다. 당일 만나요!"

                    "\n✖ 전송 실패. 아래 구글 폼 링크로 응답해주세요.";
                })
                .then(function () {
                  setBusy(false);
                });
            });
          });
        });
      })();

    window.scrollTo(0,0);
  }
  document.querySelectorAll('.sw button').forEach(function(b){b.addEventListener('click',function(){setMode(b.dataset.m,true)})});
  var h=location.hash.replace('#','');
  var m=(h==='dev'||h==='invite')?h:(store.get('party_mode')||'invite');
  setMode(m==='dev'?'dev':'invite',false);
})();
</script>
</body>
</html>
